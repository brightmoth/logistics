<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" role="img" aria-labelledby="title description">
  <title id="title">MoveWise waypoints logo concept</title>
  <desc id="description">Three connected shipment waypoints form a simple path beside the MoveWise wordmark.</desc>
  <rect width="640" height="180" rx="24" fill="#EAF5F1"/>
  <g transform="translate(25 24)">
    <path d="M30 92 62 60l29 23 37-45" fill="none" stroke="#174A50" stroke-linecap="round" stroke-linejoin="round" stroke-width="9"/>
    <circle cx="30" cy="92" r="12" fill="#39A985" stroke="#EAF5F1" stroke-width="5"/>
    <circle cx="62" cy="60" r="12" fill="#FFFFFF" stroke="#174A50" stroke-width="6"/>
    <circle cx="91" cy="83" r="12" fill="#FFFFFF" stroke="#174A50" stroke-width="6"/>
    <circle cx="128" cy="38" r="12" fill="#39A985" stroke="#EAF5F1" stroke-width="5"/>
  </g>
  <text x="190" y="108" fill="#174A50" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" letter-spacing="-2">MoveWise</text>
</svg>
